[project]
name = "career-agent"
version = "0.1.0"
description = "AI career assistant using RAG"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docx2txt>=0.9",
    "gradio>=5.22.0",
    "langchain-chroma>=0.2.6",
    "langchain-community>=0.3.20",
    "langchain-openai>=0.3.9",
    "openai>=1.68.2",
    "pymupdf>=1.28.0",
    "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = [
    "ipykernel>=6.30.1",
]
